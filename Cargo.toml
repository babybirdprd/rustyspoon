[package]
name = "rustyspoon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.18"
html2md = "0.2"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
ammonia = "3.3"
chromiumoxide = { version = "0.8.0", features = ["tokio-runtime", "tokio"] }
futures = "0.3"
axum = "0.8.7"
tower-http = { version = "0.6.8", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
